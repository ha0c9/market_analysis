# Heuristic plans used when the LLM planner is unavailable,
# and as a seed so the planner stays on-distribution.
presets:
  - match: ["存储", "nand", "dram", "hbm", "闪存", "memory"]
    sectors: ["存储芯片 / NAND", "DRAM / HBM", "半导体设备"]
    keywords:
      - 存储
      - 闪存
      - NAND
      - DRAM
      - HBM
      - 内存
      - Micron
      - 三星
      - SK海力士
      - 兆易创新
      - 江波龙
    news_queries:
      - 存储芯片 NAND DRAM HBM
      - NAND DRAM memory chip shortage price
    tickers:
      - sh603986   # 兆易创新
      - sz300223   # 北京君正
      - sh688008   # 澜起科技
      - sz301308   # 江波龙
      - sh688525   # 佰维存储
      - sz001309   # 德明利
      - MU
    etfs:
      - sh512480   # 半导体ETF
      - sz159995   # 芯片ETF
      - SOXX
  - match: ["半导体", "芯片", "chip", "semiconductor"]
    sectors: ["半导体", "晶圆代工", "设备材料"]
    keywords: ["半导体", "芯片", "晶圆", "光刻", "NVIDIA", "台积电", "中芯"]
    news_queries: ["半导体 芯片 晶圆", "semiconductor chip foundry"]
    tickers: [sh688981, sz002371, NVDA, TSM]
    etfs: [sh512480, sz159995, SOXX]
  - match: ["医药", "创新药", "biotech", "pharma", "医疗", "CXO", "制药"]
    sectors: ["创新药", "医疗器械", "医药商业 / CXO"]
    keywords: ["医药", "创新药", "医疗器械", "CXO", "集采", "恒瑞", "迈瑞", "药明康德", "北向资金"]
    news_queries: ["创新药 医疗器械 集采", "China biotech pharma policy"]
    tickers:
      - sh600276   # 恒瑞医药
      - sz300760   # 迈瑞医疗
      - sh603259   # 药明康德
      - sz000661   # 长春高新
      - sh688271   # 联影医疗
      - LLY
    etfs:
      - sh512010   # 医药ETF
      - sh512170   # 医疗ETF
      - sz159992   # 创新药ETF
      - XBI
  - match: ["新能源", "锂电", "光伏", "battery"]
    sectors: ["锂电池", "光伏", "新能源车"]
    keywords: ["锂电", "光伏", "新能源", "电池", "储能"]
    news_queries: ["新能源 锂电 光伏", "EV battery solar"]
    tickers: [sz300750, sh601012, TSLA]
    etfs: [sz159755, sh515790]
default:
  sectors: ["大盘", "成长风格", "价值风格"]
  keywords: ["股市", "A股", "美股", "央行", "通胀", "北向资金", "风险偏好"]
  news_queries: ["A股 美股 财经", "stock market federal reserve"]
  tickers: [sh600519, sz300750, AAPL]
  etfs: []

