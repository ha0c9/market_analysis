rss:
  - id: bbc_business
    name: BBC Business
    url: https://feeds.bbci.co.uk/news/business/rss.xml
    class: major_media
  - id: cnbc_world
    name: CNBC
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    class: major_media
  - id: marketwatch
    name: MarketWatch
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    class: major_media
  - id: chinanews_finance
    name: 中新网财经
    url: https://www.chinanews.com.cn/rss/finance.xml
    class: major_media
  - id: xinhua_fortune
    name: 新华网财经
    url: http://www.xinhuanet.com/fortune/news_fortune.xml
    class: official
  - id: people_finance
    name: 人民网财经
    url: https://www.people.com.cn/rss/finance.xml
    class: official
  - id: wallstreetcn
    name: 华尔街见闻
    url: https://feed.wallstreetcn.com/rss
    class: major_media
  - id: sina_finance
    name: 新浪财经
    url: https://rss.sina.com.cn/roll/finance/hot_roll.xml
    class: major_media

# 财联社电报没有 RSS，由 src/ingest/cls.py 拉取公开 roll 接口。
# level A/B（页面标红/重点）会提高权重，作为 A 股盘面参考。

# GitHub-hosted runners sit outside China; gl=CN often returns 503.
# HK edition still returns Chinese results and is more reachable.
google_news:
  zh: https://news.google.com/rss/search?q={query}&hl=zh-CN&gl=HK&ceid=HK:zh-Hans
  en: https://news.google.com/rss/search?q={query}&hl=en-US&gl=US&ceid=US:en

# Always fetched as market backdrop. Sector ETFs and names come from the analysis plan.
benchmarks:
  - { symbol: sh000001, name: 上证指数 }
  - { symbol: sh000300, name: 沪深300 }
  - { symbol: sz399006, name: 创业板指 }
  - { symbol: ^HSI, name: 恒生指数 }
  - { symbol: ^N225, name: 日经225 }
  - { symbol: ^KS11, name: 首尔综合指数 }
  - { symbol: ^GSPC, name: 标普500 }
  - { symbol: ^IXIC, name: 纳斯达克 }

# Extra Google News queries appended by the planner. {focus} is substituted.
sentiment_query: "{focus} 市场情绪 北向资金 风险偏好"
official_query: "{focus} (证监会 OR 交易所公告 OR 央行 OR 新华社)"
blog_query: "{focus} (专栏 OR 博客 OR 复盘 OR 点评)"
volume_query: "{focus} 成交量 放量 缩量 量能"
northbound_query: "{focus} 北向资金 外资 沪股通 深股通"

# Higher weight = more influence when ranking evidence for the synthesizer.
source_ranks:
  official:
    weight: 3.0
    match:
      - 证监会
      - csrc.gov.cn
      - sse.com.cn
      - szse.cn
      - pbc.gov.cn
      - 统计局
      - stats.gov.cn
      - 财政部
      - mof.gov.cn
      - 新华社
      - 新华网
      - xinhuanet
      - 人民网
      - people.com.cn
      - 国务院
      - gov.cn
  major_media:
    weight: 2.0
    match:
      - 中新网
      - chinanews
      - reuters
      - bbc
      - cnbc
      - marketwatch
      - 财联社
      - cls.cn
      - 证券时报
      - 上海证券报
      - 第一财经
      - yicai
      - 经济观察
      - 华尔街见闻
      - wallstreetcn
      - 新浪财经
      - sina.com.cn
  google_news:
    weight: 1.3
    match: ["Google News"]
  blog:
    weight: 0.85
    match:
      - 博客
      - 专栏
      - substack
      - medium.com
      - 雪球
      - xueqiu
      - 知乎
      - zhihu.com
      - 微信公众号
      - weixin.qq.com
