<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>市场舆情研究助手</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="kicker">Research desk</p>
        <h1>市场舆情研究助手</h1>
      </div>
      <p class="disclaimer">研究辅助，不是投资建议。价格可能延迟，社交源默认未接入。</p>
    </header>

    <section class="panel controls">
      <label>
        分析侧重点
        <input id="focus" type="text" placeholder="例如：医药相关、恒瑞医药、sh600276" />
      </label>
      <label>
        回看小时
        <input id="lookback" type="number" min="6" max="72" value="36" />
      </label>
      <button id="start" type="button">在 GitHub 启动分析</button>
      <button id="reload" type="button" class="ghost">刷新报告</button>
    </section>
    <p class="hint" id="hint">
      密钥在 GitHub Actions Secrets 中，不会出现在本页。点击后到仓库 Actions 里 Run workflow，把侧重点粘贴进去。板块 ETF 与个股随侧重点变化；大盘基准固定。
    </p>

    <section id="status" class="panel status" hidden></section>
    <section id="snapshot" class="panel snapshot" hidden></section>
    <section id="ai-summary" class="ai-summary" hidden>
      <header class="ai-summary-head">
        <div>
          <p class="kicker">AI 总结</p>
          <h2>板块前瞻与交叉笔记</h2>
        </div>
        <span id="ai-badge" class="ai-badge">—</span>
      </header>
      <p class="hint ai-summary-note">
        以下叙述由规划/综合模型（或规则草稿）根据公开新闻与行情写成，不是行情接口原文。
      </p>
      <div id="outlook"></div>
      <section id="notes" class="panel notes-inside"></section>
    </section>
    <section id="errors" class="panel errors" hidden></section>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
