<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>市场舆情研究助手</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="kicker">Research desk</p>
        <h1>市场舆情研究助手</h1>
      </div>
      <p class="disclaimer">研究辅助，不是投资建议。价格可能延迟，社交源默认未接入。</p>
    </header>

    <section class="panel controls">
      <label>
        分析侧重点
        <input id="focus" type="text" placeholder="例如：存储相关" />
      </label>
      <label>
        回看小时
        <input id="lookback" type="number" min="6" max="72" value="36" />
      </label>
      <button id="start" type="button">在 GitHub 启动分析</button>
      <button id="reload" type="button" class="ghost">刷新报告</button>
    </section>
    <p class="hint" id="hint">
      密钥在 GitHub Actions Secrets 中，不会出现在本页。点击后到仓库 Actions 里 Run workflow，把侧重点粘贴进去。
    </p>

    <section id="status" class="panel status" hidden></section>
    <section id="snapshot" class="panel" hidden></section>
    <section id="outlook" hidden></section>
    <section id="notes" class="panel" hidden></section>
    <section id="errors" class="panel errors" hidden></section>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
